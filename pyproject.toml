[project]
name = "bowerstone-engine"
version = "0.0.0"
description = "The Bowerstone engine: the one backend program that runs every Bowerstone app."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]>=3.3.6,<4",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy>=2.1.4,<2.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "httpx>=0.28.1,<0.29",
    "hypothesis>=6.169.0,<7",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.0,<0.18",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/bowerstone_engine"]

[tool.ruff]
target-version = "py313"
# Folders holding the project's own modules, so imports of them sort as first-party.
src = ["engine/src", "tests"]
# Claude Code never edits .claude/, so it is left out of lint. Its tests still run.
# Markdown is left out too: ruff would otherwise reformat the Python examples in
# the plans in docs/decisions/, which Claude Code never edits.
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Line length is left to `ruff format`, which wraps code to 88 characters. Long
# strings, comments, and docstrings, which it cannot wrap, are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with assert.
"tests/**" = ["S101"]
"engine/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["engine/src", "engine/tests", "tests"]
# Lets mypy see that settings models read their values from the environment.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "engine/tests", ".claude/hooks"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
