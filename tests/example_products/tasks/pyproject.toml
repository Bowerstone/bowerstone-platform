[project]
name = "bowerstone-example-tasks"
version = "0.1.0"
description = "A test-only Bowerstone product, used by the engine's own tests"
requires-python = ">=3.13"
dependencies = []

[project.entry-points."bowerstone.products"]
tasks = "bowerstone_example_tasks.manifest:PRODUCT"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowerstone_example_tasks"]
