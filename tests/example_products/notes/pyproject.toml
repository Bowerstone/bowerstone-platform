[project]
name = "bowerstone-example-notes"
version = "0.1.0"
description = "A test-only Bowerstone product, used by the engine's own tests"
requires-python = ">=3.13"
dependencies = []

[project.entry-points."bowerstone.products"]
notes = "bowerstone_example_notes.manifest:PRODUCT"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowerstone_example_notes"]

# The testing kit, from the engine, reads which product is under test.
[tool.pytest.ini_options]
bowerstone_product = "notes"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
