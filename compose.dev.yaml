# Development containers. The Makefile runs every command through them.
#
# The passwords below are for local development and tests only. The development
# database's can be overridden with an environment variable of the same name.

name: bowerstone-platform

services:
  db:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: bowerstone_admin
      POSTGRES_PASSWORD: ${BOWERSTONE_ADMIN_PASSWORD:-dev-admin-password}
      POSTGRES_DB: bowerstone
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
      BOWERSTONE_OWNER_PASSWORD: ${BOWERSTONE_OWNER_PASSWORD:-dev-owner-password}
      BOWERSTONE_APP_PASSWORD: ${BOWERSTONE_APP_PASSWORD:-dev-app-password}
    volumes:
      # From Postgres 18 the image keeps its data in /var/lib/postgresql/18/docker
      # and declares its volume at /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Local only, and not 5432, so it does not clash with another Postgres.
      - 127.0.0.1:${BOWERSTONE_DB_PORT:-15432}:5432
    healthcheck:
      # Checks over TCP, which the image's temporary setup server does not
      # listen on, so the database is healthy only once setup has finished.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=bowerstone_admin, --dbname=bowerstone]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # The tests' own Postgres servers. They keep their data in memory, so it is
  # gone when they stop, and they never touch the development database. The
  # tests create the two roles and a fresh database for each test.
  test-db:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment: &test-db-environment
      POSTGRES_USER: bowerstone_admin
      POSTGRES_PASSWORD: test-admin-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
    # Durability is pointless for throwaway data, and turning it off makes the tests faster.
    command: &test-db-command [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    tmpfs:
      - /var/lib/postgresql
    healthcheck: &test-db-healthcheck
      test: [CMD, pg_isready, --host=127.0.0.1, --username=bowerstone_admin, --dbname=postgres]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # Postgres 17, so the tests can show that the engine refuses a server of the wrong version.
  test-db-17:
    image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment: *test-db-environment
    command: *test-db-command
    tmpfs:
      # Before Postgres 18 the image keeps its data here.
      - /var/lib/postgresql/data
    healthcheck: *test-db-healthcheck

  engine:
    build:
      context: docker
      dockerfile: engine.Dockerfile
    image: bowerstone-platform-engine-dev
    working_dir: /workspace
    environment:
      # The development database, for `make migrate` and the bowerstone command.
      BOWERSTONE_ENV: development
      BOWERSTONE_OWNER_DATABASE_URL: postgresql://bowerstone_owner:${BOWERSTONE_OWNER_PASSWORD:-dev-owner-password}@db:5432/bowerstone
      BOWERSTONE_DATABASE_URL: postgresql://bowerstone_app:${BOWERSTONE_APP_PASSWORD:-dev-app-password}@db:5432/bowerstone
      # Used only by the tests. `make test` starts both servers first.
      BOWERSTONE_TEST_ADMIN_URL: postgresql://bowerstone_admin:test-admin-password@test-db:5432/postgres
      BOWERSTONE_TEST_PG17_ADMIN_URL: postgresql://bowerstone_admin:test-admin-password@test-db-17:5432/postgres
    volumes:
      - .:/workspace
      - engine-venv:/venv
      - dev-cache:/cache

  web:
    image: node:22.23.4-trixie-slim@sha256:2117f713a417f3aff682ac8f5bc2ebbdf1beed51f36e67ab1e0fd3866b6d2d8f
    working_dir: /workspace
    entrypoint: [sh, docker/web-entrypoint.sh]
    environment:
      npm_config_cache: /cache/npm
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - dev-cache:/cache

volumes:
  db-data:
  engine-venv:
  web-node-modules:
  dev-cache:
